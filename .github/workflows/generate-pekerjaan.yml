name: Generate halaman Hasil Pekerjaan

on:
  push:
    branches: [main]
    paths:
      - "data/pekerjaan.json"
      - "assets/pekerjaan/**"
      - "pekerjaan/template.html"
      - "pekerjaan/list-template.html"
      - "pekerjaan/generate.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-pekerjaan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate halaman pekerjaan + sitemap
        run: python pekerjaan/generate.py

      - name: Commit dan push hasil generate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pekerjaan/ sitemap.xml

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan halaman untuk di-commit."
            exit 0
          fi

          git commit -m "chore: auto-generate halaman hasil pekerjaan [skip ci]"

          for i in 1 2 3 4 5; do
            echo "Percobaan push ke-$i..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push berhasil."
              exit 0
            fi

            echo "Push gagal, mencoba lagi..."
            sleep 3
          done

          echo "Gagal melakukan push setelah 5 percobaan."
          exit 1