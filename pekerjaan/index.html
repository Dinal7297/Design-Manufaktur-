<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Pekerjaan | DESIGN MANUFAKTUR</title>
<meta name="description" content="Dokumentasi hasil pekerjaan pagar, kanopi, tenda, teralis, pintu, railing dan fabrikasi besi DESIGN MANUFAKTUR di Cibinong Bogor.">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222
}
.container{
  max-width:1000px;
  margin:auto;
  padding:25px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px
}
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.08)
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover
}
.card-content{
  padding:18px
}
.card h2{
  margin:0 0 10px;
  font-size:21px
}
.card a{
  color:inherit;
  text-decoration:none
}
</style>
</head>

<body>
<div class="container">

<h1>Hasil Pekerjaan DESIGN MANUFAKTUR</h1>

<p>
Dokumentasi pekerjaan dan proyek DESIGN MANUFAKTUR
di Cibinong, Bogor dan Jabodetabek.
</p>

<div id="daftar-pekerjaan" class="grid"></div>

</div>

<script>
fetch('/data/pekerjaan.json')
.then(response => response.json())
.then(data => {

  const container = document.getElementById('daftar-pekerjaan');

  if (!data.length) {
    container.innerHTML = '<p>Belum ada pekerjaan.</p>';
    return;
  }

  container.innerHTML = data.map(item => `
    <article class="card">
      <a href="${item.url}">
        <img
          src="${item.image}"
          alt="${item.imageAlt}"
          loading="lazy">
        <div class="card-content">
          <h2>${item.title}</h2>
          <p>${item.description}</p>
          <small>${item.date}</small>
        </div>
      </a>
    </article>
  `).join('');
})
.catch(error => {
  console.error(error);
  document.getElementById('daftar-pekerjaan').innerHTML =
    '<p>Data pekerjaan gagal dimuat.</p>';
});
</script>

</body>
</html>
